[package]
name = "mova"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "mova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
gif = "0.13"
color_quant = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1"
adler32 = "1"
flate2 = "1"
notify = { version = "7", features = ["macos_kqueue"] }

# Git integration: using gix (gitoxide) instead of git2 (libgit2 bindings).
# Decision rationale:
# - gix is pure Rust → no C/libgit2 dependency → simpler cross-compilation
# - Smaller binary footprint (~2-3MB vs ~5MB for git2)
# - Sufficient API coverage for MVP: init, status, add, commit, log
# - Build complexity eliminated (no libgit2 cmake build required)
# - git2 would be more stable/polished, but the build overhead isn't justified for our use case
# Features selected for MVP:
#   - worktree-mutation: staging/checkout/add operations
#   - status: git status equivalent
#   - revision: rev-parse/describe for log functionality
gix = { version = "0.84", default-features = false, features = ["sha1", "worktree-mutation", "status", "revision", "tree-editor"] }
# Note: enable "max-performance-safe" or a perf feature if build time/throughput matters later.
